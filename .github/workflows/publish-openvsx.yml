name: Publish Open VSX

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag (e.g. v1.2.0)'
                required: true
            gate:
                description: 'Release gate (must match RELEASE_GATE secret)'
                required: true

# Least privilege: read the repository and request the OIDC token.
permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            # Anti-accident check, not a security secret: a stray manual run must
            # pass the gate value or it stops here, before any publish.
            - name: Verify release gate
              env:
                  EXPECTED_GATE: ${{ secrets.RELEASE_GATE }}
                  PROVIDED_GATE: ${{ inputs.gate }}
              run: |
                  if [ -z "$EXPECTED_GATE" ]; then
                    echo "::error::RELEASE_GATE secret is not configured. Publishing is blocked."
                    exit 1
                  fi
                  if [ "$PROVIDED_GATE" != "$EXPECTED_GATE" ]; then
                    echo "::error::Release gate mismatch. Publishing is blocked."
                    exit 1
                  fi

            # This job has no checkout, so there is no git repository for gh to
            # read the target repository from; GH_REPO names it explicitly.
            - name: Download the tested .vsix from the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: gh release download "${{ inputs.tag }}" --pattern '*.vsix' --dir .

            - name: Publish the exact file (no rebuild)
              run: npx --yes ovsx publish --packagePath ./*.vsix
